  "@sentry/nextjs": 10.69.0
  "@t3-oss/env-nextjs": ^0.13.11
  "@tailwindcss/postcss": ^4.3.3
  "@types/node": ^24.13.3
  drizzle-orm: 0.45.2
  motion: ^12.43.0
  "server-only": 0.0.1
  tailwindcss: ^4.3.3
  typescript: ^5.9.3
  zod: 4.4.3
catalogs:
  auth:
    "@better-auth/infra": 0.3.7
    better-auth: 1.6.26
  next:
    "@next/bundle-analyzer": 16.3.0
    next: 16.3.0
  orpc:
    "@orpc/client": 1.14.14
    "@orpc/server": 1.14.14
    "@orpc/tanstack-query": 1.14.14
  react:
    "@types/react": 19.2.18
    "@types/react-dom": 19.2.4
